name: Meddle tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'games/meddle/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  meddle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Run committed Meddle tests
        run: >-
          node --test
          games/meddle/renew-land-prototype.test.mjs
          games/meddle/rules.test.mjs
          games/meddle/support-prototype.test.mjs
          games/meddle/support-shadow.test.mjs
