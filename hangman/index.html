<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;connect-src 'none';object-src 'none';frame-ancestors 'self'"><title>Hangman</title><link rel="stylesheet" href="../shared/board-games.css"><link rel="stylesheet" href="game.css"></head><body><main class="shell"><header class="topbar"><div class="title"><h1>Hangman</h1><p>Uncover the word before six misses finish the drawing.</p></div><div class="controls"><select id="mode"><option value="cpu">Random word</option><option value="local">Enter a phrase</option></select><input id="phrase" type="password" maxlength="48" placeholder="Secret phrase" hidden><button id="new" class="primary">New game</button></div></header><section class="game-layout"><div class="panel play"><div id="figure" class="figure" aria-label="Hangman drawing"></div><div id="word" class="word"></div><div id="letters" class="letters"></div></div><aside class="panel status"><div class="status-card"><span>Misses</span><strong id="misses">0 of 6</strong></div><div class="status-card"><span>Result</span><strong id="result">In play</strong></div><div id="message" class="message">Choose a letter.</div><div id="stats" class="stats"></div></aside></section></main><script src="../shared/scores.js"></script><script src="game.js"></script></body></html>
