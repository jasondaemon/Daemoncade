<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111d">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self' 'unsafe-eval'; img-src 'self' data:; connect-src 'none'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'">
  <title>Blockfall</title>
  <link rel="stylesheet" href="game.css?v=1.0.0">
</head>
<body data-theme="modern">
  <main class="arcade-shell">
    <div class="marquee">
      <div><p>Daemoncade presents</p><h1>BLOCKFALL</h1></div>
      <div class="marquee-tools">
        <button id="backToLobby" class="icon-button game-only" type="button" aria-label="Return to mode selection" title="Return to mode selection">←</button>
        <button id="soundToggle" class="icon-button" type="button" aria-pressed="true" aria-label="Mute sound effects" title="Mute sound effects">🔊</button>
        <button id="refreshGame" type="button" hidden>Refresh</button>
      </div>
    </div>

    <section id="lobby" class="attract-stage">
      <canvas id="attractCanvas" width="600" height="900" aria-hidden="true"></canvas>
      <div class="scanlines" aria-hidden="true"></div>
      <div class="attract-menu">
        <p class="insert-credit">Select your game</p>
        <div class="mode-grid" role="group" aria-label="Game mode">
          <button data-mode="endless" type="button" class="mode-card active"><strong>ENDLESS</strong><span>Outlast the rising speed</span></button>
          <button data-mode="timed" type="button" class="mode-card"><strong>TIMED</strong><span>Beat the clock</span></button>
        </div>
        <div class="theme-picker" role="group" aria-label="Visual theme">
          <span>Cabinet style</span>
          <button data-theme-choice="gameboy" type="button">GREEN</button>
          <button data-theme-choice="eightbit" type="button">8-BIT</button>
          <button data-theme-choice="modern" type="button" class="active">MODERN</button>
        </div>
        <div class="option-row">
          <label id="durationWrap" hidden><span>Time</span><select id="duration"><option value="60">1:00</option><option value="120" selected>2:00</option><option value="180">3:00</option><option value="300">5:00</option></select></label>
          <label><span>Music</span><select id="musicSelect"><option value="grid">The Grid</option><option value="korobeiniki">Korobeiniki</option><option value="korobeinikiGb">Korobeiniki GB</option><option value="adventure">Adventure</option><option value="casey">Casey</option><option value="midnight">Midnight Run</option><option value="">Off</option></select></label>
        </div>
        <button id="startMode" type="button" class="start-button">START ENDLESS</button>
        <div class="record-strip"><div><span>Endless</span><strong id="endlessBest">0</strong></div><div><span>Timed</span><strong id="timedBest">0</strong></div><div><span>Runs</span><strong id="gamesPlayed">0</strong></div></div>
        <p class="first-sound">Music begins with your first input.</p>
      </div>
      <strong id="playerNameLabel" hidden>Player</strong><div id="openGames" hidden></div>
    </section>

    <section id="gamePanel" class="game-panel" hidden>
      <div class="game-toolbar">
        <div><span id="gameState">Ready</span><strong id="gameStatus"></strong></div>
        <div class="toolbar-actions"><label>Music<select id="gameMusicSelect"><option value="grid">The Grid</option><option value="korobeiniki">Korobeiniki</option><option value="korobeinikiGb">Korobeiniki GB</option><option value="adventure">Adventure</option><option value="casey">Casey</option><option value="midnight">Midnight Run</option><option value="">Off</option></select></label><button data-control="pause" class="icon-button" type="button" aria-label="Pause game" title="Pause">Ⅱ</button></div>
      </div>
      <div class="play-layout">
        <div class="side-stack"><div class="mini-card"><span>HOLD</span><canvas id="holdCanvas" width="96" height="96"></canvas></div><div class="mini-card"><span>NEXT</span><canvas id="nextCanvas" width="96" height="96"></canvas></div><div id="garbagePanel" class="mini-card" hidden><span>GARBAGE</span><strong id="garbageCount">0</strong></div></div>
        <div class="board-wrap"><canvas id="boardCanvas" width="300" height="600" aria-label="Blockfall playfield"></canvas><div id="effectsLayer" class="effects-layer" aria-hidden="true"></div><div id="overlay" class="game-overlay" hidden><strong id="overlayTitle">PAUSED</strong><span id="overlayText"></span><div class="overlay-actions"><button id="resumeGame" type="button" class="primary">RESUME</button><button id="playAgain" type="button">PLAY AGAIN</button></div></div></div>
        <div class="right-rail"><div class="hud"><div><span>SCORE</span><strong id="score">0</strong></div><div><span>LINES</span><strong id="lines">0</strong></div><div><span>LEVEL</span><strong id="level">1</strong></div><div><span>TIME</span><strong id="timeLeft">0:00</strong></div></div><div id="opponents" hidden></div></div>
      </div>
      <div class="touch-controls" aria-label="Touch controls"><button data-control="hold" type="button" aria-label="Hold piece">HOLD</button><button data-control="left" type="button" aria-label="Move left">←</button><button data-control="soft" type="button" aria-label="Soft drop">↓</button><button data-control="right" type="button" aria-label="Move right">→</button><button data-control="rotate" type="button" class="primary" aria-label="Rotate clockwise">↻</button><button data-control="hard" type="button" class="drop-button" aria-label="Hard drop">DROP</button></div>
      <button id="leaveGame" type="button" hidden>Leave</button><button id="closeGame" type="button" hidden>Close</button>
    </section>
    <p id="message" class="message" role="status"></p>
  </main>
  <script src="../shared/scores.js?v=1.0.0"></script>
  <script src="../vendor/pixi/pixi.min.js?v=7.4.3"></script>
  <script src="game.js?v=1.0.0"></script>
</body>
</html>
