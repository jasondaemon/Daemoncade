<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;connect-src 'none';object-src 'none';frame-ancestors 'self'"><title>Dots and Boxes</title><link rel="stylesheet" href="../shared/board-games.css"><link rel="stylesheet" href="game.css"></head><body><main class="shell"><header class="topbar"><div class="title"><h1>Dots and Boxes</h1><p>Close a box to claim it and keep the turn.</p></div><div class="controls"><select id="mode"><option value="cpu">Play computer</option><option value="local">Two players</option></select><select id="size"><option value="3">3 × 3</option><option value="4" selected>4 × 4</option><option value="5">5 × 5</option></select><button id="new" class="primary">New game</button></div></header><section class="game-layout"><div class="panel"><div id="board" class="board"></div></div><aside class="panel status"><div class="status-card"><span>Turn</span><strong id="turn">A</strong></div><div class="status-card"><span>Score</span><strong id="score">0 · 0</strong></div><div id="message" class="message">Player A draws first.</div><div id="stats" class="stats"></div></aside></section></main><script src="../shared/scores.js"></script><script src="game.js"></script></body></html>
