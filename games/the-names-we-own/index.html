<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>The Names We Own</title>
  <link rel="stylesheet" href="game.css">
  <script defer src="settings.js"></script>
  <script defer src="vendor/questjs/_util.js"></script>
  <script defer src="vendor/questjs/_settings.js"></script>
  <script defer src="vendor/questjs/lang-en.js"></script>
  <script defer src="vendor/questjs/_file_saver.js"></script>
  <script defer src="vendor/questjs/_saveload.js"></script>
  <script defer src="vendor/questjs/_text.js"></script>
  <script defer src="vendor/questjs/_io.js"></script>
  <script defer src="vendor/questjs/_command.js"></script>
  <script defer src="vendor/questjs/_defaults.js"></script>
  <script defer src="vendor/questjs/_templates.js"></script>
  <script defer src="vendor/questjs/_world.js"></script>
  <script defer src="vendor/questjs/_npc.js"></script>
  <script defer src="vendor/questjs/_parser.js"></script>
  <script defer src="vendor/questjs/_commands.js"></script>
  <script defer src="story.js"></script>
  <script defer src="game.js"></script>
</head>
<body>
  <header><h1>The Names We Own</h1><p>Bellwick Crossing</p></header>
  <main id="main">
    <figure>
      <pre id="bridge" aria-hidden="true"></pre>
      <figcaption id="bridge-status">Fog hides the center of the bridge.</figcaption>
    </figure>
    <section id="inner" aria-label="Field journal">
      <p id="loading" role="status">Opening the field journal…</p>
      <div id="output" role="log" aria-label="Story transcript" tabindex="0"></div>
      <div id="input"></div>
      <nav aria-label="Suggested commands">
        <button type="button" data-command="look">Look</button>
        <button type="button" data-command="help">Help</button>
        <button type="button" data-command="hint">Hint</button>
        <button type="button" id="submit-command">Enter</button>
      </nav>
    </section>
  </main>
  <dialog id="dialog"><div id="dialog-title"></div><div id="dialog-content"></div><div id="dialog-footer"></div></dialog>
  <div id="quest-map" hidden></div>
  <div id="quest-image" hidden></div>
  <form id="fileDialogForm" hidden><input id="fileDialog" type="file" accept=".q6save"></form>
</body>
</html>
