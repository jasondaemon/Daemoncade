<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>The Names We Own</title>
  <link rel="stylesheet" href="game.css?v=11">
  <script defer src="settings.js"></script>
  <script defer src="vendor/questjs/_util.js"></script>
  <script defer src="vendor/questjs/_settings.js"></script>
  <script defer src="vendor/questjs/lang-en.js"></script>
  <script defer src="vendor/questjs/_file_saver.js"></script>
  <script defer src="vendor/questjs/_saveload.js"></script>
  <script defer src="vendor/questjs/_text.js"></script>
  <script defer src="vendor/questjs/_io.js"></script>
  <script defer src="vendor/questjs/_command.js"></script>
  <script defer src="vendor/questjs/_defaults.js"></script>
  <script defer src="vendor/questjs/_templates.js"></script>
  <script defer src="vendor/questjs/_world.js"></script>
  <script defer src="vendor/questjs/_npc.js"></script>
  <script defer src="vendor/questjs/_parser.js"></script>
  <script defer src="vendor/questjs/_commands.js"></script>
  <script defer src="story.js?v=11"></script>
  <script defer src="campaign.js?v=11"></script>
  <script defer src="side-stories.js?v=11"></script>
  <script defer src="scenes.js?v=11"></script>
  <script defer src="encounter.js?v=11"></script>
  <script defer src="stakes.js?v=11"></script>
  <script defer src="checkpoint.js?v=11"></script>
  <script defer src="game.js?v=11"></script>
</head>
<body>
  <header><h1>THE NAMES WE OWN</h1><span id="chapter">CHAPTER 1 / BELLWICK CROSSING</span></header>
  <main id="main">
    <figure aria-label="Current location">
      <div class="scene-view">
        <pre id="bridge" aria-hidden="true"></pre>
        <section id="encounter" aria-labelledby="encounter-name" hidden>
          <header class="encounter-header">
            <h2 id="encounter-name"><b id="speaker-name">ORRA</b> <span id="speaker-role">// TROLL KEEPER</span></h2>
            <button id="encounter-close" type="button">Leave</button>
          </header>
          <div class="encounter-body">
            <pre id="encounter-portrait" aria-hidden="true"></pre>
            <div>
              <p id="encounter-line"></p>
              <div class="encounter-topics" aria-label="Topics">
                <button type="button" data-topic="ask orra about the plank">The plank</button>
                <button type="button" data-topic="ask orra about the bell">The bell</button>
                <button type="button" id="encounter-invitation" data-topic="show invitation to orra">Show invitation</button>
              </div>
            </div>
          </div>
        </section>
      </div>
      <figcaption class="scene-footer"><span id="bridge-status">Fog hides the center of the bridge.</span><button id="scene-view-toggle" type="button">Hide art</button><button id="scene-motion" type="button" aria-pressed="false">Pause scene motion</button></figcaption>
    </figure>
    <section id="inner" aria-label="Terminal transcript and command line">
      <p id="loading" role="status">Opening the field journal…</p>
      <div id="output" role="log" aria-label="Story transcript" tabindex="0"></div>
      <div id="input"></div>
      <nav id="commands" class="command-bar" aria-label="Available commands">
        <button type="button" data-command="look" disabled>Look</button>
        <button type="button" data-command="inventory" disabled>Inventory</button>
        <button type="button" data-command="help" disabled>Help</button>
        <button type="button" data-command="hint" disabled>Hint</button>
        <button type="button" data-command="journal" disabled>Journal</button>
        <button type="button" data-command="examine ledger" data-room="tollhouse" hidden>Examine ledger</button>
        <button type="button" data-command="talk to orra" data-room="tollhouse" hidden>Talk to Orra</button>
        <button type="button" data-command="talk to fen" data-room="tollhouse" hidden>Talk to Fen</button>
        <button type="button" data-command="south" data-room="tollhouse" hidden>South · riverbank</button>
        <button type="button" data-command="east" data-room="tollhouse" data-requires="cross" hidden>East · bridge</button>
        <button type="button" data-command="talk to leth" data-room="riverbank" hidden>Talk to Leth</button>
        <button type="button" data-command="north" data-room="riverbank" hidden>North · tollhouse</button>
        <button type="button" data-command="west" data-room="crossing" hidden>West · tollhouse</button>
        <button type="button" data-command="review evidence" data-room="tollhouse" hidden>Review evidence</button>
        <button type="button" data-command="name orra" data-room="tollhouse" data-reveal="confront" hidden>Question the keeper’s account</button>
        <button type="button" data-command="challenge fen" data-room="tollhouse" data-reveal="confront" hidden>Challenge Fen’s tally</button>
        <button type="button" data-command="sell the bell" data-room="tollhouse" data-reveal="settle" hidden>Sell the bell</button>
        <button type="button" data-command="sign over the tolls" data-room="tollhouse" data-reveal="settle" hidden>Sign over the tolls</button>
        <button type="button" data-command="north" data-room="crossing" hidden>North · old road</button>
        <button type="button" data-command="examine milepost" data-room="washout" hidden>Examine milepost</button>
        <button type="button" data-command="talk to fen" data-room="washout" hidden>Talk to Fen</button>
        <button type="button" data-command="south" data-room="washout" hidden>South · bridge</button>
        <button type="button" data-command="east" data-room="washout" data-requires="road" hidden>East · orchard</button>
        <button type="button" data-command="examine tags" data-room="orchard" hidden>Examine tags</button>
        <button type="button" data-command="talk to iven" data-room="orchard" hidden>Talk to Iven</button>
        <button type="button" data-command="west" data-room="orchard" hidden>West · old road</button>
        <button type="button" data-command="north" data-room="orchard" data-requires="orchard" hidden>North · hall</button>
        <button type="button" data-command="examine charter" data-room="hall" hidden>Examine charter</button>
        <button type="button" data-command="talk to neris" data-room="hall" hidden>Talk to Neris</button>
        <button type="button" data-command="south" data-room="hall" hidden>South · orchard</button>
        <button type="button" data-command="east" data-room="hall" data-requires="hearing" hidden>East · road home</button>
        <button type="button" data-command="west" data-room="home" hidden>West · council hall</button>
        <button type="button" data-command="west" data-room="washout" hidden>West · signal ridge</button>
        <button type="button" data-command="examine basket" data-room="ridge" hidden>Examine signal basket</button>
        <button type="button" data-command="east" data-room="ridge" hidden>East · old road</button>
        <button type="button" data-command="east" data-room="orchard" hidden>East · orchard shed</button>
        <button type="button" data-command="examine note" data-room="vestry" hidden>Read folded note</button>
        <button type="button" data-command="west" data-room="vestry" hidden>West · orchard</button>
        <button type="button" data-command="north" data-room="hall" hidden>North · copy room</button>
        <button type="button" data-command="examine drawer" data-room="records" hidden>Look in the drawer</button>
        <button type="button" data-command="south" data-room="records" hidden>South · hearing</button>
      </nav>
      <button id="retry-run" type="button" hidden>Retry from the tollhouse</button>
      <p class="command-help"><kbd>↑ ↓</kbd> command history <span>/</span> <span id="checkpoint-status" role="status">Auto-save on</span></p>
    </section>
  </main>
  <dialog id="dialog"><div id="dialog-title"></div><div id="dialog-content"></div><div id="dialog-footer"></div></dialog>
  <div id="quest-map" hidden></div>
  <div id="quest-image" hidden></div>
  <form id="fileDialogForm" hidden><input id="fileDialog" type="file" accept=".q6save"></form>
</body>
</html>
