<!doctype html>
<html lang="en" data-apex-test="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Run integration test</title><link rel="stylesheet" href="game.css"></head>
<body><main id="game"><canvas id="view" tabindex="0" aria-label="Apex Run 3D race"></canvas><section id="loading"><strong>APEX RUN</strong><span>Integration test</span></section><header class="hud"><div><span class="label">TIME</span><strong id="time">00:00.000</strong><small id="delta"></small></div><div class="checkpoint"><span class="label">SECTOR</span><strong id="checkpoint">0 / 4</strong><small id="next-gate">NEXT 1</small></div><div class="speed"><strong id="speed">000</strong><span>KM/H</span></div></header><div id="run-status"></div><aside id="nav-guide"><canvas id="minimap" width="180" height="150"></canvas><div class="bearing"><span id="bearing-arrow">↑</span><b id="bearing-label">GATE 1</b></div></aside><div id="countdown"></div><div id="split" hidden></div><nav class="quick-actions"><button id="settings" type="button">SETTINGS</button></nav><aside class="controls"></aside><aside id="telemetry" hidden><strong>DRIVING DATA</strong><dl><div><dt>LATERAL</dt><dd id="telemetry-lateral"></dd></div><div><dt>LONGITUDINAL</dt><dd id="telemetry-longitudinal"></dd></div><div><dt>SLIP</dt><dd id="telemetry-slip"></dd></div><div><dt>CONTACT</dt><dd id="telemetry-contact"></dd></div></dl></aside><section id="pause-card" hidden><span>RACE PAUSED</span><strong>Settings</strong><p></p><select id="pause-quality"><option value="high">HIGH</option><option value="low">LOW</option></select><button id="pause-telemetry"></button><button id="pause-ghost"></button><button id="pause-sound"></button><button id="resume" type="button">Resume</button></section><section id="start-card" hidden><button id="start-settings"></button><button id="start-race"></button></section><section id="result" hidden><span>RUN COMPLETE</span><strong id="result-time"></strong><p id="result-pb"></p><ol id="result-splits"></ol><p id="result-analysis"></p><button id="again" type="button">Race again</button></section></main><script type="module" src="game.js?v=0.5.0-alpha31"></script></body></html>
