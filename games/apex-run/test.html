<!doctype html>
<html lang="en" data-apex-test="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apex Run integration test</title><link rel="stylesheet" href="game.css"></head>
<body><main id="game"><canvas id="view" tabindex="0" aria-label="Apex Run 3D race"></canvas><section id="loading"><strong>APEX RUN</strong><span>Integration test</span></section><header class="hud"><div><span class="label">TIME</span><strong id="time">00:00.000</strong><small id="delta"></small></div><div class="checkpoint"><span class="label">GATE</span><strong id="checkpoint">0 / 5</strong><small id="next-gate">NEXT 1</small></div><div class="speed"><strong id="speed">000</strong><span>KM/H</span></div></header><aside id="nav-guide"><canvas id="minimap" width="180" height="150"></canvas><div class="bearing"><span id="bearing-arrow">↑</span><b id="bearing-label">GATE 1</b></div></aside><div id="countdown"></div><nav class="quick-actions"><button id="pause" type="button">PAUSE</button><button id="mute" type="button">SOUND ON</button></nav><aside class="controls"></aside><section id="pause-card" hidden><span>RACE PAUSED</span><strong>Paused</strong><p></p><button id="resume" type="button">Resume</button></section><section id="result" hidden><span>RUN COMPLETE</span><strong id="result-time"></strong><p id="result-pb"></p><button id="again" type="button">Race again</button></section></main><script type="module" src="game.js?v=0.5.0-alpha11"></script></body></html>
