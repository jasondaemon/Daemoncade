<!doctype html><html lang="en" data-apex-test="1"><head><meta charset="utf-8"><title>Skyline lifecycle test</title><link rel="stylesheet" href="game.css"></head><body><main id="game">
<canvas id="view" tabindex="0"></canvas><section id="loading"><strong>APEX RUN</strong><span>SKYLINE TEST</span></section>
<header class="hud"><div><strong id="time"></strong><small id="delta"></small></div><div><strong id="checkpoint"></strong><small id="next-gate"></small></div><strong id="speed"></strong></header><div id="run-status"></div>
<aside id="nav-guide"><canvas id="minimap" width="180" height="150"></canvas><span id="bearing-arrow"></span><b id="bearing-label"></b></aside><div id="countdown"></div><div id="split" hidden></div>
<button id="practice-exit" hidden>CLEAN RACE</button><button id="settings"></button><aside class="controls"><span id="retry-control"></span><span id="restart-control"></span></aside><aside id="telemetry" hidden><dd id="telemetry-lateral"></dd><dd id="telemetry-longitudinal"></dd><dd id="telemetry-slip"></dd><dd id="telemetry-contact"></dd></aside>
<section id="pause-card" hidden><select id="pause-quality"><option value="high">HIGH</option><option value="medium">MEDIUM</option><option value="low">LOW</option></select><button id="pause-telemetry"></button><button id="pause-ghost"></button><button id="pause-sound"></button><button id="resume"></button></section>

<aside id="lifecycle-runner"><button id="run-lifecycle">RUN PB + GHOST LIFECYCLE</button><button id="place-loop">PLACE AT LOOP RUN-UP · PRACTICE</button><button id="place-water">TEST HARBOR WATER RECOVERY</button><output id="lifecycle-report"></output></aside></main>
<section id="quality-confirm" hidden><b id="quality-confirm-tier"></b><button id="quality-cancel"></button><button id="quality-apply"></button></section>
<script type="module" src="game.js?v=0.5.0-alpha186-pickup-compact"></script><script type="module" src="test-lifecycle-ui.js?v=0.5.0-alpha149-skyline-legibility"></script></body></html>
