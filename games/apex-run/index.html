<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Apex Run</title>
  <link rel="stylesheet" href="game.css?v=0.1.0-a1">
</head>
<body>
  <main id="game">
    <canvas id="view" aria-label="Apex Run 3D race"></canvas>
    <section id="loading"><strong>APEX RUN</strong><span>Building the stadium…</span></section>
    <header class="hud">
      <div><span class="label">TIME</span><strong id="time">00:00.000</strong><small id="delta">PERSONAL BEST —</small></div>
      <div class="checkpoint"><span class="label">GATE</span><strong id="checkpoint">0 / 3</strong></div>
      <div class="speed"><strong id="speed">000</strong><span>KM/H</span></div>
    </header>
    <div id="countdown" aria-live="polite"></div>
    <aside class="controls"><b>WASD / ARROWS</b> drive · <b>SPACE</b> brake · <b>BACKSPACE</b> recover · <b>R</b> restart</aside>
    <section id="result" hidden>
      <span>RUN COMPLETE</span><strong id="result-time">00:00.000</strong><p id="result-pb"></p>
      <button id="again" type="button">Race again</button>
    </section>
  </main>
  <script type="module" src="game.js?v=0.1.0-a1"></script>
</body>
</html>
