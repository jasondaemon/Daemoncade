<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'">
  <title>Neon Breaker</title>
  <link rel="stylesheet" href="game.css?v=1.1.0">
  <link rel="stylesheet" href="portrait.css?v=1.1.0">
</head>
<body>
  <main class="shell">
    <section class="stage-wrap">
      <div id="game-host" role="application" aria-label="Neon Breaker game field"></div>
      <div id="overlay" class="overlay">
        <div class="overlay-card">
          <p id="eyebrow">A luminous brick-breaking tribute</p>
          <h2 id="overlay-title">Neon Breaker</h2>
          <p id="overlay-copy">Move the paddle, launch the pulse, and keep the combo alive.</p>
          <button id="start" type="button">Start run</button>
          <button id="campaign" class="secondary-action" type="button" hidden>Start latest sector</button>
          <small>Mouse / touch · A D or ← → · Space to launch · P pause · O options</small>
        </div>
      </div>
      <div id="toast" class="toast" aria-live="polite"></div>
      <section id="settings-panel" class="settings-panel" aria-label="Game settings" hidden>
        <div class="settings-card">
          <p>Game settings</p><h2>Player setup</h2>
          <label>Ball pace<select id="pace"><option value="comfortable">Comfortable</option><option value="arcade">Arcade</option><option value="quick">Quick</option></select></label>
          <label>Effects volume<input id="volume" type="range" min="0" max="100" step="5"></label>
          <label>Music volume<input id="music-volume" type="range" min="0" max="100" step="5"></label>
          <label class="check"><input id="reduced-motion" type="checkbox"> Reduced motion</label>
          <label class="check"><input id="haptics" type="checkbox"> Mobile haptics</label>
          <div class="settings-actions"><button id="fullscreen" type="button">Fullscreen</button><button id="close-settings" type="button">Done</button></div>
        </div>
      </section>
    </section>
  </main>
  <script src="../shared/scores.js?v=1.1.0"></script>
  <script src="../vendor/phaser/phaser-arcade-physics.min.js?v=3.90.0"></script>
  <script src="game.js?v=1.1.0"></script>
</body>
</html>
