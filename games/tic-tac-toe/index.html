<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07130e"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-ancestors 'self'"><title>Tic-Tac-Toe</title><link rel="stylesheet" href="../shared/board-games.css"><link rel="stylesheet" href="game.css"></head><body><main class="shell"><header class="topbar"><div class="title"><h1>Tic-Tac-Toe</h1><p>Quick rounds, local opponents, and a computer that can fight back.</p></div><div class="controls"><select id="mode" aria-label="Game mode"><option value="cpu">Play computer</option><option value="local">Two players</option></select><select id="difficulty" aria-label="Difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><button id="new" class="primary">New round</button></div></header><section class="game-layout"><div class="panel"><div id="board" class="board" aria-label="Tic-Tac-Toe board"></div></div><aside class="panel status"><div class="status-card"><span>Turn</span><strong id="turn">X</strong></div><div class="status-card"><span>Round</span><strong id="result">In play</strong></div><div id="message" class="message">You are X. Choose a square.</div><div id="stats" class="stats"></div></aside></section></main><script src="../shared/scores.js"></script><script src="game.js"></script></body></html>
