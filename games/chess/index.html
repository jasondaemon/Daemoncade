<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self';script-src 'self';img-src 'self' data:;connect-src 'none';object-src 'none';frame-ancestors 'self'"><title>Chess</title><link rel="stylesheet" href="../shared/board-games.css?v=1.0.0"><link rel="stylesheet" href="game.css?v=1.0.0"></head><body><main class="shell"><header class="topbar"><div class="title"><h1>Chess</h1><p>A complete local board with legal moves, castling, promotion, and three computer levels.</p></div><div class="controls"><select id="mode"><option value="cpu">Play computer</option><option value="local">Two players</option></select><select id="difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><button id="new" class="primary">New game</button></div></header><section class="game-layout"><div class="panel"><div id="board" class="board" aria-label="Chess board"></div></div><aside class="panel status"><div class="status-card"><span>Turn</span><strong id="turn">White</strong></div><div class="status-card"><span>Position</span><strong id="result">In play</strong></div><div id="message" class="message">White moves first. Choose a piece.</div><div class="controls side-controls"><button id="undo">Undo</button><button id="flip">Flip board</button><button id="copy">Copy PGN</button></div><details><summary>Move history</summary><ol id="history" class="history"></ol></details><div id="stats" class="stats"></div></aside></section></main><dialog id="promotion"><form method="dialog"><h2>Promote pawn</h2><div class="controls"><button value="q">Queen</button><button value="r">Rook</button><button value="b">Bishop</button><button value="n">Knight</button></div></form></dialog><script src="../shared/scores.js?v=1.0.0"></script><script type="module" src="game.js?v=1.0.0"></script></body></html>
